[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netharness"
version = "0.1.0"
description = "Containerlab + FRR network test harness: OSPF/BGP convergence under link faults"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Dev tools are pinned exactly: a new ruff release once broke CI by changing format
# rules (it began formatting code blocks inside README.md). Bump deliberately.
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools]
packages = ["netharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)-7s %(name)s: %(message)s"
markers = [
    "unit: pure-python tests, no Docker required",
    "integration: needs containerlab + Docker",
    "ospf: OSPF scenarios",
    "bgp: BGP scenarios",
    "failure: link failure / restore scenarios",
    "netem: netem loss/delay scenarios (skipped if kernel lacks sch_netem)",
    "bfd: BFD-accelerated failure detection",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["netharness", "scripts/compare_baseline.py", "scripts/collect_trends.py"]
mypy_path = "scripts"
