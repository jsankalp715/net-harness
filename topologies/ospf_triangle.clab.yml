# 3-router OSPF triangle (single area 0).
#
#            r1 (10.0.0.1)
#      eth1 /          \ eth2
#   10.1.12.0/30    10.1.13.0/30
#      eth1 /            \ eth1
#   r2 (10.0.0.2) ---- r3 (10.0.0.3)
#            eth2  10.1.23.0/30  eth2
#
# Addressing / OSPF parameters live in ospf_triangle.vars.yml and are rendered
# from templates/ by netharness.Lab, then pushed via vtysh.
name: ospf-tri

topology:
  defaults:
    kind: linux
    image: quay.io/frrouting/frr:10.5.5
    binds:
      - ../configs/daemons:/etc/frr/daemons:ro
      - ../configs/vtysh.conf:/etc/frr/vtysh.conf:ro
    # Dual-stack: forward IPv6, and skip Duplicate Address Detection. Measured: with DAD,
    # every IPv6 recovery waited ~1.4-2.3 s for addresses to leave "tentative" (OSPFv3
    # restore 2.71 s vs 1.33 s without). Statically addressed p2p links can't collide.
    # See docs/FINDINGS.md.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.all.forwarding: 1
      net.ipv6.conf.all.accept_dad: 0
      net.ipv6.conf.default.accept_dad: 0
      net.ipv6.conf.all.dad_transmits: 0
      net.ipv6.conf.default.dad_transmits: 0
  nodes:
    r1: {}
    r2: {}
    r3: {}
  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "r3:eth1"]
    - endpoints: ["r2:eth2", "r3:eth2"]
